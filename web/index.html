  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/i18n/boot.js"></script>

<body>
  <header id="topbar">
    <div class="brand" title="Republika Srbija"><span class="brand-emblem" aria-hidden="true">★</span><span class="brand-text">SRBIJA</span></div>
    <div id="yields" class="yields" aria-label="Prinosi Republike Srbije"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Pretraga gradova i okruga" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Pretraga gradova i okruga (/ ili Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-script" class="btn" aria-label="Promeni pismo" title="Promeni pismo"></button>
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Podeli ovaj prikaz" title="Podeli: kopirajte vezu ili preuzmite sliku"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Pomoć za tastaturu i miš" title="Pomoć (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Otvori Almanah" title="Šta svaki broj znači i odakle dolazi"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="Heksagonalna mapa Republike Srbije"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Detalji"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Izbor sočiva"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Legenda sočiva"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Sočiva mape">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resursi na heksima (R)" title="Prikaži ili sakrij resurse na heksima (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimapa: kliknite da skočite" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Prikaži minimapu"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Rezultati pretrage" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Podeli" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="Izveštaj za Republiku Srbiju" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanah">
      <button class="close icon-btn" data-close aria-label="Zatvori Almanah">✕</button>
      <nav id="pedia-nav" aria-label="Stranice Almanaha"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">Kartografisanje zemlje…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
