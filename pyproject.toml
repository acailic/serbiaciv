[project]
name = "serbiaciv"
version = "0.1.0"
description = "Srbija kao strateška igra, građena od stvarnih podataka (a fork of usaciv by Andrej Karpathy)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aleksandar Ilic" }]
keywords = ["serbia", "srbija", "open-data", "data-visualization", "interactive-map", "hex-map", "census", "geospatial", "openstreetmap", "civilization"]
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3,<2",
    "numpy>=1.24,<3",
    "pyshp>=2.3,<3",
    "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://acailic.github.io/serbiaciv/"
Repository = "https://github.com/acailic/serbiaciv"
Issues = "https://github.com/acailic/serbiaciv/issues"
Design = "https://github.com/acailic/serbiaciv/blob/main/docs/DESIGN.md"

[tool.uv]
package = false
