name: Bug report
description: Something in the interface or the data pipeline does not work
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Live atlas (acailic.github.io/serbiaciv)
        - Running locally
        - Data pipeline
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For the atlas, include the map link from the address bar. For the pipeline, include the command and its output.
      render: text
  - type: input
    id: env
    attributes:
      label: Browser / OS / Python version
